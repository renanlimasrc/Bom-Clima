[project]
name = "bom-clima"
# Single source of truth for the version: bom_clima/__init__.py is read by
# hatchling at build time, so there is nothing to keep in sync by hand.
dynamic = ["version"]
description = "Bom Clima — beautiful CLI weather app using the Open-Meteo API"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    {name = "ninrod"},
]
classifiers = [
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/renanlimasrc/Bom-Clima"
Repository = "https://github.com/renanlimasrc/Bom-Clima.git"
Issues = "https://github.com/renanlimasrc/Bom-Clima/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-requests>=2.28.0",
    "pyyaml>=6.0",
    "build>=1.0",
]

[project.scripts]
bom-clima = "bom_clima.cli:main"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
# PEP 639 (license-files) needs hatchling >= 1.27.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bom_clima/__init__.py"
